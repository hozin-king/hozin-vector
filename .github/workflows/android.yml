name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Keystore PERSISTEN (bukan ephemeral CI) — tanda tangan APK stabil
    # antar rilis, jadi APK baru bisa install timpa. Tanpa secret ini, AGP
    # memakai keystore debug ephemeral (tanda tangan berubah tiap run).
    - name: Restore persistent keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          echo "debug.keystore dipulihkan dari secret — build memakai tanda tangan persisten"
        else
          echo "DEBUG_KEYSTORE_BASE64 tidak ada — build memakai keystore ephemeral (tanda tangan berubah tiap run)"
        fi

    - name: Install Rust toolchain + Android targets
      run: |
        if ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
        fi
        . "$HOME/.cargo/env"
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        cargo --version; rustc --version

    # Uji mesin trace Rust (median-cut + vtracer) sebelum build Android.
    - name: Rust unit tests (vectrace)
      run: |
        . "$HOME/.cargo/env"
        cd app/src/main/rust/vectrace && cargo test --release

    # NDK 26.1 (sesuai ndkVersion di build.gradle) — runner ubuntu tidak
    # membawa NDK; tanpa ini android.ndkDirectory melempar "NDK is not installed".
    - name: Install Android NDK 26.1
      run: |
        echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;26.1.10909125"
        ls "$ANDROID_HOME/ndk/"

    # Build RELEASE (bukan debug) — APK rilis yang disalurkan ke user.
    - name: Build release APK
      run: |
        . "$HOME/.cargo/env"
        ./gradlew assembleRelease --stacktrace

    # Verifikasi .so Rust di APK — 4 ABI, simbol JNI lengkap.
    - name: Verify Rust lib in APK
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "APK: $APK"
        mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
        unzip -o -q "$GITHUB_WORKSPACE/$APK" 'lib/*/libvectrace.so'
        for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          SO="lib/$ABI/libvectrace.so"
          test -f "$SO" || { echo "HILANG: $SO"; exit 1; }
          SYMS=$(nm -D --defined-only "$SO" 2>/dev/null | grep -c "Java_com_hozinking_vector_VectorEngine_traceNative" || true)
          echo "$ABI: $(wc -c < "$SO") byte, simbol JNI: $SYMS"
          test "$SYMS" -ge 1 || { echo "simbol JNI hilang di $ABI"; exit 1; }
        done
        echo "Verifikasi .so Rust OK (4 ABI, JNI lengkap)."

    # Auto-rilis — tiap push ke main yang lolos build langsung bikin
    # tag v<versionName> + GitHub Release berisi APK-nya (tanpa langkah manual).
    # Bila tag sudah ada (push kedua untuk versi yang sama), lewati diam-diam.
    # Catatan: step upload-artifact DIHAPUS — kuota storage Actions akun penuh
    # sejak 9 Nov; APK disalurkan lewat Release saja.
    - name: Auto-release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VER=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
        TAG="v$VER"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG sudah ada, lewati."
        else
          gh release create "$TAG" --title "Hozin Vector v$VER" \
            --notes "Rilis otomatis dari push ke main. APK release (bukan debug). v1.0: ubah foto jadi vektor SVG — pilih foto, atur jumlah warna (2-16) & detail, Proses, lalu Salin/Simpan/Bagikan. Satu path per warna, jadi tiap bagian bisa dianimasikan sendiri di Alight Motion. Offline penuh, tanpa iklan, tanpa login." \
            app/build/outputs/apk/release/*.apk
          echo "Release $TAG dibuat."
        fi
